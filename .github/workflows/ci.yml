name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  build-and-test:
    name: Node ${{ matrix.node-version }} / ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        suite: [core, view-engine, viewer]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build suite and dependencies
        run: node .github/scripts/ci-suite.mjs build
        env:
          CI_SUITE: ${{ matrix.suite }}

      - name: Test suite
        run: node .github/scripts/ci-suite.mjs test
        env:
          CI_SUITE: ${{ matrix.suite }}
          COLLECT_COVERAGE: ${{ matrix.node-version == 24 }}
          VITEST_MAX_WORKERS: 2
          npm_config_workspace_concurrency: 1

      - name: Stage coverage with package paths
        if: always() && matrix.node-version == 24
        run: |
          mkdir -p coverage-artifact
          for report in packages/*/coverage/coverage-final.json; do
            if [ -f "$report" ]; then
              cp --parents "$report" coverage-artifact/
            fi
          done

      - name: Preserve suite coverage
        if: always() && matrix.node-version == 24
        uses: actions/upload-artifact@v6
        with:
          name: unit-coverage-node24-${{ matrix.suite }}
          path: coverage-artifact/
          retention-days: 7
          if-no-files-found: ignore

  coverage:
    name: Combined coverage
    needs: [changes, build-and-test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: unit-coverage-node24-*
          merge-multiple: true
          path: coverage-artifacts
      - name: Require coverage from every package
        run: node .github/scripts/check-coverage.mjs
      - name: Upload combined coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-artifacts/packages/*/coverage/coverage-final.json
          disable_search: true
          fail_ci_if_error: true
