name: Build Storybook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  build-and-test:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Type-check the stories against the built packages
        run: pnpm typecheck:stories

      - name: Verify acceptance process cleanup
        run: node --test scripts/owned-process.test.mjs

      - name: Build Storybook and verify its index
        run: pnpm build-storybook

  interactions:
    name: Storybook interactions
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # STORYBOOK_BROWSERS widens this to firefox/webkit; see the workflow README.
      - name: Test Storybook interactions
        run: pnpm test:storybook
