name: Engineering Quality
on:
  pull_request:
    branches: [main, 5.x]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 5.x]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  quality:
    name: Engineering Quality
    needs: changes
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check CI policy regressions
        run: node --test .github/scripts/*.test.mjs
      # Wow → fetcher only: no workspace may depend on @ahoo-wang/wow-*.
      - name: Check dependency direction
        run: node .github/scripts/dependency-direction.mjs
      - run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/format-changed.mjs
      - name: Build packages for static checks
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.storybook == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.wiki == 'true'
        run: pnpm -r --filter './packages/*' build
      # Packs each published package and resolves its declarations with attw
      # under node10, node16 (CommonJS and ES modules) and bundler, then
      # type-checks an .mts and a .cts consumer of each in one tsc run
      # (node16, nodenext), so its .d.ts and .d.cts must load together.
      - name: Check published package types
        if: needs.changes.outputs.code == 'true'
        run: pnpm check:package-types
      - name: Lint without rewriting files
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.storybook == 'true' || needs.changes.outputs.integration == 'true'
        run: |
          pnpm -r --filter './packages/*' exec eslint .
          pnpm --dir integration-test exec eslint .
          pnpm lint:stories
      - name: Check all package types against built dependencies
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.storybook == 'true'
        run: pnpm -r --filter './packages/*' exec tsc --noEmit --incremental false --composite false
      - name: Build documentation
        if: needs.changes.outputs.wiki == 'true'
        run: pnpm --dir wiki build
