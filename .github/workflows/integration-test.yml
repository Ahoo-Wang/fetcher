# Integration Test Workflow (required; listed in release admission)
# Builds the integration workspace, generates the Wow clients from the example
# server, type-checks, and runs the `required` cases: those that need nothing
# outside the CI job (the Wow cases talk to the service containers below).
# Cases that reach the public internet (JSONPlaceholder, an OpenAI-compatible
# provider) run in the advisory integration-external.yml instead, so a
# third-party outage cannot block a merge or a release.
name: Integration Test

on:
  push:
    branches: [main, 5.x]
  pull_request:
    branches: [main, 5.x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  integration-test:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.3.11
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
          MONGO_INITDB_DATABASE: wow_example_db
        options: >-
          --health-cmd="mongosh -u root -p root --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      wow:
        image: ghcr.io/ahoo-wang/wow-example-server:9.1.5
        ports:
          - 8080:8080
        env:
          SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchClientAutoConfiguration,org.springframework.boot.elasticsearch.autoconfigure.ElasticsearchRestClientAutoConfiguration
          SPRING_MONGODB_URI: mongodb://root:root@mongo:27017/wow_example_db?authSource=admin&maxIdleTimeMS=60000
          WOW_EVENTSOURCING_STORE_STORAGE: mongo
          WOW_EVENTSOURCING_SNAPSHOT_STORAGE: mongo
        options: --health-cmd "curl -f http://localhost:8080/actuator/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @ahoo-wang/fetcher-integration-test... build

      - name: Generate Code
        working-directory: ./integration-test
        run: node ../packages/generator/dist/cli.js generate -i http://localhost:8080/v3/api-docs

      - name: Check generated integration types
        working-directory: ./integration-test
        run: pnpm exec tsc --noEmit --incremental false --composite false

      - name: Test
        run: pnpm test:it

  # The one check the 5.x ruleset requires from this workflow (as on main).
  # Matrix jobs skipped by scope report unexpanded names, and a job whose
  # dependency fails reports "skipped", which a required check counts as
  # passing; this job always runs and fails unless every job it needs
  # succeeded or was skipped by scope.
  gate:
    name: Integration gate
    needs: [changes, integration-test]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped by scope
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
