# Integration Test Workflow (required; listed in release admission)
# Builds and type-checks the integration workspace against the built packages
# and runs its `required` cases: those that need nothing outside the CI job.
# The Fetcher and decorator JSONPlaceholder suites are among them — they run
# against a local JSONPlaceholder (json-server with JSONPlaceholder's fake-write
# semantics) that the Vitest globalSetup starts on a free port. Cases that
# reach the public internet (an OpenAI-compatible provider) and a pass of the
# same JSONPlaceholder suites against the live site run in the advisory
# integration-external.yml instead, so a third-party outage cannot block a
# merge or a release. The Wow client and generated-code cases run in the Wow
# repository.
name: Integration Test

on:
  push:
    branches: [main, 5.x]
  pull_request:
    branches: [main, 5.x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  integration-test:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @ahoo-wang/fetcher-integration-test... build

      - name: Check integration types
        working-directory: ./integration-test
        run: pnpm exec tsc --noEmit --incremental false --composite false

      - name: Test
        run: pnpm test:it
