# Integration Test Workflow
# Core packages against real HTTP services (JSONPlaceholder, an optional LLM
# provider). The Wow client and generated-code cases run in the Wow repository.
name: Integration Test

on:
  push:
    branches: [main, 5.x]
  pull_request:
    branches: [main, 5.x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  integration-test:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @ahoo-wang/fetcher-integration-test... build

      - name: Check integration types
        working-directory: ./integration-test
        run: pnpm exec tsc --noEmit --incremental false --composite false

      - name: Test
        run: pnpm test:it
        env:
          FETCHER_LLM_BASE_URL: ${{ secrets.FETCHER_LLM_BASE_URL }}
          FETCHER_LLM_API_KEY: ${{ secrets.FETCHER_LLM_API_KEY }}
          FETCHER_LLM_MODEL: ${{ secrets.FETCHER_LLM_MODEL }}
