name: PR Metadata
on:
  pull_request:
    # 6.x too: PRs into the 6.x maintenance branch need this check. 5.x is
    # absent because a pull_request run reads this file from the base branch,
    # and the 5.x branch's own copy lists 5.x.
    branches: [main, 6.x]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  metadata:
    name: PR Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
      - name: Validate title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/pr-quality.mjs
