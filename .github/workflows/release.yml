name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
  actions: read
  checks: read
jobs:
  publish-npm:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify release SHA admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-admission.mjs

      # Before building: every package carries one lowercase semver version
      # that matches the GitHub release's tag and pre-release flag
      # (scripts/release-version.mjs). Empty on workflow_dispatch.
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release-version.mjs check

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to NPM
        run: ./scripts/publish-npm.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
