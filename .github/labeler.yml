bug:
  - head-branch:
      - '^fix/'
      - '^bugfix/'

enhancement:
  - head-branch:
      - '^feature/'
      - '^feat/'

performance:
  - head-branch:
      - '^perf/'

breaking-change:
  - head-branch:
      - '^breaking/'

maintenance:
  - head-branch:
      - '^chore/'
      - '^build/'
      - '^ci/'

dependencies:
  - any:
      - head-branch:
          - '^renovate/'
          - '^dependabot/'
      - changed-files:
          - any-glob-to-any-file:
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

documentation:
  - any:
      - head-branch:
          - '^docs/'
      - changed-files:
          - any-glob-to-any-file:
              - 'wiki/**'
              - 'docs/**'
              - '**/*.md'

'area: ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

'area: core':
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/fetcher/**'
          - 'packages/decorator/**'
          - 'packages/storage/**'

'area: events':
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/eventbus/**'
          - 'packages/eventstream/**'

'area: openapi':
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/openapi/**'

'area: clients':
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/openai/**'
          - 'packages/cosec/**'

'area: react':
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/react/**'
