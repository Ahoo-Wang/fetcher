---
# Generated code snapshots (generator e2e baselines) and generator output are
# not hand-written source — linting them produces noise, not signal.
exclude_paths:
  - 'packages/generator/expected/**'
  - 'packages/generator/test-output/**'
  # Vendored from the shadcn registry, updated with `shadcn add --diff`.
  - 'packages/view-engine/src/ui/components/**'
  - 'packages/view-engine/src/ui/lib/**'
  # Stand-in sources the Wow conformance checker's tests read: fake Wow
  # checkouts in Kotlin and fake package source in TypeScript. They hold one
  # case per shape the checker must read — some deliberately not valid code —
  # so they are built to look unlike ordinary source and grow with each shape.
  - 'packages/wow/test/fixtures/**'
